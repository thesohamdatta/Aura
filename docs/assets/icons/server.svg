<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Top server unit -->
  <rect x="3" y="5" width="22" height="8" rx="2"/>
  <!-- Bottom server unit -->
  <rect x="3" y="15" width="22" height="8" rx="2"/>
  <!-- Top unit status dot -->
  <circle cx="7.5" cy="9" r="1" fill="currentColor" stroke="none"/>
  <!-- Bottom unit status dot -->
  <circle cx="7.5" cy="19" r="1" fill="currentColor" stroke="none"/>
  <!-- Top unit ventilation lines -->
  <line x1="12" y1="7" x2="20" y2="7"/>
  <line x1="12" y1="11" x2="20" y2="11"/>
  <!-- Bottom unit ventilation lines -->
  <line x1="12" y1="17" x2="20" y2="17"/>
  <line x1="12" y1="21" x2="20" y2="21"/>
</svg>
