<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Chip body -->
  <rect x="7" y="7" width="14" height="14" rx="2"/>
  <!-- Inner die -->
  <rect x="10" y="10" width="8" height="8" rx="1"/>
  <!-- Top pins -->
  <line x1="11" y1="7" x2="11" y2="4"/>
  <line x1="17" y1="7" x2="17" y2="4"/>
  <!-- Bottom pins -->
  <line x1="11" y1="21" x2="11" y2="24"/>
  <line x1="17" y1="21" x2="17" y2="24"/>
  <!-- Left pins -->
  <line x1="7" y1="11" x2="4" y2="11"/>
  <line x1="7" y1="17" x2="4" y2="17"/>
  <!-- Right pins -->
  <line x1="21" y1="11" x2="24" y2="11"/>
  <line x1="21" y1="17" x2="24" y2="17"/>
</svg>
