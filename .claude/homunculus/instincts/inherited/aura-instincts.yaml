# Aura Workflow Design System Update

## Action

Follow the design-system-update workflow:
1. Edit or add CSS utility classes in website/css/global.css (or related CSS files).
2. Update HTML files (e.g., index.html, docs.html) to use new or migrated classes.
3. Optionally update or reference verification/linter rules in documentation (e.g., AGENT_RULES.md, DEVELOPMENT_GUIDE.md).
4. Verify changes using local or documented linter/verification scripts.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: website/css/global.css, website/index.html, website/docs.html

