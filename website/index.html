<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura — AI Wearable. Always With You.</title>
    <meta name="description" content="Aura is an open-source AI wearable that captures your conversations, remembers your world, and surfaces insights through your phone — no screen required. Build yours for ~$50." />
    <meta name="theme-color" content="#050508" />

    <!-- Open Graph -->
    <meta property="og:title" content="Aura — AI Wearable. Always With You." />
    <meta property="og:description" content="An open-source AI wearable that listens, remembers, and thinks with you. Build yours for ~$50." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aura — AI Wearable" />
    <meta name="twitter:description" content="Open-source AI wearable. Captures your world. ~$50 to build." />

    <!-- Fonts: Sora + Instrument Serif + Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Fira+Code:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Skip link styles (must be inline for zero FOUC) -->
    <style>
      .skip-to-content {
        position: fixed;
        top: -100%;
        left: 1rem;
        z-index: 9999;
        background: var(--aura);
        color: var(--void);
        padding: 0.75rem 1.5rem;
        border-radius: 100px;
        font-family: 'Sora', sans-serif;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        transition: top 0.2s ease;
      }
      .skip-to-content:focus {
        top: 1rem;
        outline: 2px solid var(--aura);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <!-- Skip navigation link (accessibility) -->
    <a href="#main-content" class="skip-to-content">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
